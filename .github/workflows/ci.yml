name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GIT_AUTHOR_NAME: doki tests
  GIT_AUTHOR_EMAIL: tests@example.com
  GIT_COMMITTER_NAME: doki tests
  GIT_COMMITTER_EMAIL: tests@example.com

jobs:
  gates:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: release binary
    needs: gates
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p doki

      - name: Strip
        run: |
          strip target/release/doki
          cp target/release/doki ./doki

      - name: Smoke test
        run: |
          ./doki --version
          ./doki --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: doki-linux-x86_64
          path: doki
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --locked -p doki

      - name: Smoke test
        run: |
          ./target/release/doki --version
          ./target/release/doki --help > /dev/null

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build app bundle
        run: |
          version="$(./target/release/doki --version | awk '{print $2}')"
          bash packaging/build-macos-app.sh \
            --binary target/release/doki \
            --version "$version" \
            --arch aarch64 \
            --outdir dist

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: doki-macos-aarch64-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: doki-macos-aarch64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
