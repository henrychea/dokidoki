name: Feature request
description: Suggest a capability or a configuration option
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check [docs/ROADMAP.md](https://github.com/henrychea/dokidoki/blob/main/docs/ROADMAP.md)
        and the non-goals in [docs/DESIGN.md](https://github.com/henrychea/dokidoki/blob/main/docs/DESIGN.md).
        Automatic conflict resolution, force push, and token storage are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that doki makes difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behavior, CLI flag, or configuration key you would expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you tried.

  - type: checkboxes
    id: invariants
    attributes:
      label: Safety
      options:
        - label: The proposal does not require force push, history rewrite, hook bypass, or automatic conflict resolution.
          required: true
