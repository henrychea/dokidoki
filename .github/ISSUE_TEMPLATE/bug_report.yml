name: Bug report
description: Report a reproducible problem with doki
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove secrets, tokens, credentials, and private
        repository paths from logs and screenshots before posting.

  - type: input
    id: version
    attributes:
      label: doki version
      description: Output of `doki --version`.
      placeholder: doki 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop session (Wayland or X11), and git version.
      placeholder: Ubuntu 24.04, KDE Plasma 6 on Wayland, git 2.51
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that still shows the problem.
      placeholder: |
        1. Add a root to ~/.config/doki/config.toml
        2. Run `doki status`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Lines from `doki doctor`, the journal, or a terminal. Redact secrets and paths.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets, tokens, and private paths from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: false
