name: Bug report
description: Report a reproducible problem with doki
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove secrets, tokens, credentials, and private
        repository paths from logs and screenshots before posting.

  - type: input
    id: version
    attributes:
      label: doki version
      description: Output of `doki --version`.
      placeholder: doki 0.2.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Platform
      description: >-
        OS and version, the CPU on macOS (Apple Silicon or Intel), the
        desktop session on Linux (Wayland or X11), and your git version.
      placeholder: macOS 15.2 on Apple Silicon, git 2.51
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install method
      description: How this build of doki was installed.
      options:
        - DMG (macOS)
        - zip (macOS)
        - AppImage (Linux)
        - tarball (Linux)
        - built from source
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that still shows the problem.
      placeholder: |
        1. Add a root to ~/.config/doki/config.toml
        2. Run `doki status`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Lines from `doki doctor`, the journal, or a terminal. Redact secrets and paths.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets, tokens, and private paths from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: false
